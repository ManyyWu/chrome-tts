<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Chrome TTS</title>

  <style>
    body {
      width: 420px;
      padding: 16px;
      font-family: sans-serif;
    }

    select,
    textarea,
    button {
      box-sizing: border-box;
      width: 100%;
      margin-bottom: 12px;
    }

    textarea {
      height: 140px;
      resize: vertical;
    }

    button {
      padding: 8px;
    }

    #status {
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <label for="voice">声音</label>
  <select id="voice"></select>

  <label for="text">文本</label>
  <textarea id="text">你好，这是一段 Chrome TTS 测试。今天天气很好，我们正在检查 macOS 系统语音能否正常工作。</textarea>

  <label for="rate">语速</label>
  <input
    id="rate"
    type="range"
    min="0.5"
    max="2"
    step="0.1"
    value="1"
  >

  <button id="speak">播放</button>
  <button id="stop">停止</button>

  <div id="status">正在读取声音列表……</div>

  <script src="dist/popup.js"></script>
</body>
</html>
